[workspace]
resolver = "3"
members = [
    "crates/mm2_app",
    "crates/mm2_assets",
    "crates/mm2_formats",
    "crates/mm2_game",
    "crates/mm2_vehicle",
    "tools/mm2_inspect",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/linus/rust-mm2"

[workspace.dependencies]
bevy = { version = "0.19", default-features = false }
avian3d = "0.7"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
miniz_oxide = "0.8"
mm2_formats = { path = "crates/mm2_formats" }
mm2_assets = { path = "crates/mm2_assets" }
mm2_game = { path = "crates/mm2_game" }
mm2_vehicle = { path = "crates/mm2_vehicle" }

# Keep dev (test/profile) builds fast enough to iterate on.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
