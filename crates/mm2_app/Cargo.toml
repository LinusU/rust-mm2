[package]
name = "mm2_app"
description = "Bevy application shell for the MM2-inspired engine"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "mm2"
# Integration files are modules in the two explicit suites below.
autotests = false

[[bin]]
name = "mm2"
path = "src/main.rs"

[[bin]]
name = "mm2-host"
path = "src/bin/mm2_host.rs"

[[bin]]
name = "mm2-join"
path = "src/bin/mm2_join.rs"

[[test]]
name = "app"
path = "tests/app.rs"

[[test]]
name = "network"
path = "tests/network.rs"

[dependencies]
avian3d.workspace = true
bevy = { version = "0.19", features = ["tga", "bevy_audio"] }
clap.workspace = true
mm2_assets.workspace = true
mm2_content.workspace = true
mm2_formats.workspace = true
mm2_game.workspace = true
mm2_net.workspace = true
mm2_vehicle.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
