name: CI

on:
  # Every branch: Rally lands a task only once CI is green on the exact
  # commit its task branch points at.
  push:
  pull_request:
  # Rally's lander (land.yml) pushes with GITHUB_TOKEN, which triggers no
  # workflows, so it starts CI on the rebased branch through
  # workflow_dispatch.
  workflow_dispatch:

# A newer push to a task branch makes the older run moot; main keeps
# every run so each commit on it has a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Debug info is most of a debug Bevy target directory and nothing in
  # CI reads it; a failing test's panic message still names the file.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  test:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      # The hosted runner's free disk is smaller than a debug build of the
      # Bevy workspace plus its tests: rustc fails with
      # "No space left on device" and ld dies of SIGBUS mid-link. Drop
      # the preinstalled toolchains this job never uses.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        # System dependencies required by the enabled Bevy features
        # (bevy_winit on X11 + Wayland, bevy_audio/ALSA, udev for gamepads).
        # https://github.com/bevyengine/bevy/blob/main/docs/linux_dependencies.md
      - name: install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ pkg-config libx11-dev libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libxkbcommon-x11-dev
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --workspace

  # Non-gating platform signal (F30): does the workspace compile, tests
  # included, on the other desktop targets? It is a compile check only —
  # no window, GPU, audio device or original data — and continue-on-error
  # keeps an unexplored platform from blocking a merge until it has been
  # seen green and can be promoted into `test`.
  build-check:
    name: build-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: check
        run: cargo check --locked --workspace --all-targets
