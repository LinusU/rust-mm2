[project]
name = "mm2rl"
version = "0.1.0"
description = "Trainer for the rust-mm2 neural opponent driver"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mm2rl"]
